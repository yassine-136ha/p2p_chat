[package]
name = "p2p_chat"
version = "0.2.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "macros", "ed25519"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-socks = "0.5"
dialoguer = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

